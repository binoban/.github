name: Feature request
description: Suggest an improvement to this repository.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        For technical or deployment support, email [tech@binoban.io](mailto:tech@binoban.io).
        Omit credentials, customer data, and private deployment details.
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: What improvement would help?
    validations:
      required: true
