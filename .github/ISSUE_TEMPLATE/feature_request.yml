name: Feature request
description: Suggest an improvement to a Binoban public repository or SDK
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the use case and the outcome you want.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like to see? Alternatives you've considered?
    validations:
      required: false
  - type: input
    id: component
    attributes:
      label: Affected component
      placeholder: e.g. iOS SDK, Android example, OpenAPI spec
    validations:
      required: false
