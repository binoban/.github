name: Bug report
description: Report a reproducible problem.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        For technical support, email [tech@binoban.io](mailto:tech@binoban.io).
        Report vulnerabilities through the [security policy](https://github.com/binoban/.github/blob/main/SECURITY.md).
        Remove credentials, customer data, and private deployment details.
  - type: input
    id: component-version
    attributes:
      label: Component and version
      placeholder: "Package and version, commit, or documentation URL"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: "OS, browser, runtime, and relevant tool versions"
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include a small reproduction or relevant logs if available.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
